<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Cloud Cost Optimizer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 1.85rem; font-weight: 800;">Cloud Cost Alerts</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
                    Immediate warnings triggered by high-severity waste anomalies and unattached infrastructure
                </p>
            </div>
            <button type="button" class="btn btn-secondary" onclick="markAllAlertsRead()">
                <span>✓</span> Mark All as Read
            </button>
        </div>

        <div class="card">
            <div th:if="${alerts.empty}" style="text-align: center; color: var(--text-dim); padding: 3rem;">
                <h3>🔔 No Alerts Active</h3>
                <p style="margin-top: 0.5rem; font-size: 0.9rem;">You are up to date on all cost warnings.</p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div th:each="alert : ${alerts}" th:id="'alert-item-' + ${alert.id}" 
                     class="card" 
                     th:style="${alert.read ? 'padding: 1rem 1.25rem; opacity: 0.6; background: rgba(15, 23, 42, 0.4);' : 'padding: 1rem 1.25rem; border-left: 3px solid var(--accent-cyan);'}">
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <span class="badge" th:classappend="${'badge-' + alert.severity.name().toLowerCase()}" th:text="${alert.severity}">HIGH</span>
                            <div>
                                <div style="font-weight: 600; font-size: 0.95rem;" th:text="${alert.message}">Alert message text</div>
                                <div style="font-size: 0.775rem; color: var(--text-dim); margin-top: 0.2rem;">
                                    Type: <span class="code-pill" th:text="${alert.alertType}">IDLE_EC2_ALERT</span> • 
                                    <span th:text="${#temporals.format(alert.createdAt, 'yyyy-MM-dd HH:mm:ss')} + ' UTC'">2026-10-07 10:15:00 UTC</span>
                                </div>
                            </div>
                        </div>

                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <button th:if="${!alert.read}" type="button" class="btn btn-secondary btn-sm mark-read-btn" th:onclick="'markAlertAsRead(' + ${alert.id} + ')'">
                                Mark Read
                            </button>
                            <span th:if="${alert.read}" style="font-size: 0.8rem; color: var(--text-dim);">Read</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/navbar :: scanModal}"></div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
