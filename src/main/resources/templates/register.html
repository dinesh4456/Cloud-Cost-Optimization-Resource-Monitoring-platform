<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Cloud Cost Optimizer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto; width: 48px; height: 48px; font-size: 1.4rem;">⚡</div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join the CloudOps Governance Platform</p>
        </div>

        <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" class="form-input" placeholder="Dinesh Kumar" required autocomplete="name">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Work Email</label>
                <input type="email" id="email" class="form-input" placeholder="dinesh@cloudops.local" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password (min 8 characters)</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••••••" minlength="8" required autocomplete="new-password">
            </div>

            <button type="submit" id="registerBtn" class="btn btn-emerald" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
                Register User Account
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.825rem; color: var(--text-dim); text-align: center;">
            <p>
                Already have an account? <a href="/login" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">Sign In</a>
            </p>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                if (res.ok) {
                    showToast('Account registered successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 600);
                } else {
                    const err = await res.json();
                    showToast(err.message || 'Registration failed', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Register User Account';
                }
            } catch (ex) {
                showToast('Network error: ' + ex.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Register User Account';
            }
        }
    </script>
</body>
</html>
